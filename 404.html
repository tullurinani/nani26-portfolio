<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="robots" content="noindex,follow">
  <title>Page not found | NANI26</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/theme-refinement.css">
  <style>
    .not-found{min-height:calc(100vh - 82px);display:grid;place-items:center;padding:65px 24px;overflow:hidden}
    .not-found-inner{width:min(760px,100%);text-align:center;position:relative;isolation:isolate}
    .not-found-art{height:230px;display:grid;place-items:center;perspective:900px;margin:0 auto 16px;position:relative}
    .not-found-orb{width:170px;height:170px;border-radius:42% 58% 57% 43%;background:linear-gradient(145deg,#d4b28b,#79927a 62%,#496a56);box-shadow:inset -18px -20px 35px rgba(41,63,47,.2),inset 15px 16px 28px rgba(255,255,255,.52),0 28px 55px rgba(58,72,56,.18);transform-style:preserve-3d;animation:lostFloat 7s ease-in-out infinite;position:relative}
    .not-found-orb:before,.not-found-orb:after{content:"";position:absolute;inset:18px;border:1px solid rgba(255,255,255,.55);border-radius:inherit;transform:translateZ(25px) rotate(22deg)}
    .not-found-orb:after{inset:-17px;border-color:rgba(166,104,75,.4);transform:translateZ(-15px) rotate(-30deg)}
    .not-found-number{position:absolute;font:500 11px var(--mono);letter-spacing:3px;color:#fbf8ef;transform:translateZ(60px)}
    .not-found h1{font-size:clamp(48px,8vw,76px);letter-spacing:-4px;line-height:1.02;margin:8px 0 16px;color:#2c3a31}
    .not-found p{max-width:490px;margin:0 auto;color:#68746c;font-size:15px;line-height:1.85}
    .not-found-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
    .not-found-note{margin-top:44px;color:#8a9188;font:10px var(--mono);letter-spacing:1.5px}
    @keyframes lostFloat{0%,100%{transform:translateY(0) rotateX(8deg) rotateY(-10deg)}50%{transform:translateY(-13px) rotateX(-5deg) rotateY(12deg)}}
    @media(prefers-reduced-motion:reduce){.not-found-orb{animation:none}}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="NANI26 home"><span class="brand-mark">N<span>26</span></span><span class="brand-name">NANI<span>26</span></span></a>
    <a class="back-home" href="/">Back to portfolio ↗</a>
  </header>
  <main class="not-found">
    <div class="not-found-inner">
      <div class="not-found-art" aria-hidden="true"><div class="not-found-orb"><span class="not-found-number">N26 / 404</span></div></div>
      <span class="section-index">A SMALL DETOUR</span>
      <h1>This page took<br><span class="gradient-text">another route.</span></h1>
      <p>The address may have changed, or the page may not exist. The portfolio is still here — head back and keep exploring.</p>
      <div class="not-found-actions"><a class="btn btn-primary" href="/">Back to home <span>↗</span></a><a class="btn btn-ghost" href="/#contact">Get in touch</a></div>
      <div class="not-found-note">NANI26 · IDENTITY / TECHNOLOGY / CONTINUOUS LEARNING</div>
    </div>
  </main>
</body>
</html>
